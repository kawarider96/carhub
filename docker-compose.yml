version: "3.9"

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carhub_app
    restart: unless-stopped
    ports:
      - "8000:8000"

    # Laravel valódi .env fájljának betöltése
    env_file:
      - ./backend/.env

    # Ezek maradhatnak környezeti override-ok
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: carhub
      DB_USERNAME: root
      DB_PASSWORD: root

    volumes:
      - ./backend:/var/www/html

    depends_on:
      - db

    command: >
      sh -c "
      php artisan migrate:fresh --seed &&
      php artisan serve --host=0.0.0.0 --port=8000
      "

  db:
    image: mysql:8.0
    container_name: carhub_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: carhub
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  db_data:
